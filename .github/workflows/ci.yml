name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs these same checks before publishing

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra report --extra hf-datasets --extra serve
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # File hygiene, lockfile, ruff check, ruff format and basedpyright (.pre-commit-config.yaml)
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra report --extra hf-datasets --extra serve
      - run: uv run pytest --cov
