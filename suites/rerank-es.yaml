    - query: Horario de apertura de la biblioteca
      documents:
        - La biblioteca abre de lunes a viernes de 9:00 a 20:00.
        - La biblioteca tiene más de 20.000 libros.
        - El museo abre los domingos.
        - Los sábados la biblioteca abre de 10:00 a 14:00.
