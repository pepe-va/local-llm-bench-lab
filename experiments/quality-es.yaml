# Which model writes Spanish best (PRD §41), and how fast, on the same hardware.
version: 1
extends: [_profiles/pi5.yaml, _profiles/deterministic.yaml]

experiment:
  name: quality-es
  tags: [pi5, quality, spanish]

models:
  - { id: qwen3-1.7b-q4km, source: "hf://unsloth/Qwen3-1.7B-GGUF:Q4_K_M" }
  - { id: gemma3-1b-q4km, source: "hf://unsloth/gemma-3-1b-it-GGUF:Q4_K_M" }

defaults:
  load: { threads: 4, ctx_size: 4096 }
  server: { reasoning: "off" }        # judge the answer, not the thinking

phases:
  bench: { enabled: false }
  quality:
    enabled: true
    suites: [../suites/es-writing.yaml, ../suites/hf-gsm8k.yaml]
  # Subjective scores (grammar, clarity, faithfulness...) for the `llm_judge` parts of
  # es-writing, stored apart from the objective ones. Use a stronger model than the judged ones.
  judge:
    enabled: true
    model: { source: "hf://unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M" }
    config: { load.ctx_size: 8192, server.reasoning: "off" }
  # Standard benchmark through lm-evaluation-harness (extra `lm-eval`), generation tasks only.
  lm_eval: { enabled: false, tasks: [gsm8k], limit: 50 }
